[build]
  builder = "nixpacks"

[install]
  npm_version = "20"
  python_version = "3.14"

[env]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.14"
  OPERATING_MODE = "manual"
  AVAILABILITY = "online"
  LOG_LEVEL = "INFO"
  CB_IN_PAPER_MODE = "true"
  P2P_ASSET = "USDT"
  P2P_FIAT = "SDG"

[mounts]
  source = "data"
  destination = "/app/data"

[deploy]
  start_command = "python3 main.py"
  healthcheck_path = "/api/journal/summary"
