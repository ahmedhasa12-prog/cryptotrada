version: "3.9"

services:
  app:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://cryptotrada:${POSTGRES_PASSWORD:-cryptotrada}@db:5432/cryptotrada
      - DB_PATH=data/trading.db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptotrada
      POSTGRES_USER: cryptotrada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptotrada}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptotrada -d cryptotrada"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
