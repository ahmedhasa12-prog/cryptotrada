app = 'cryptotrada'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/app/data/trading.db'

# Persistent volume for SQLite database
[[mounts]]
  source = 'cryptotrada_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep 1 machine running so the scheduler keeps polling every 5 min
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
