[build]
  builder = "docker"

[env]
  PORT = "8080"
  OPERATING_MODE = "manual"
  AVAILABILITY = "online"
  LOG_LEVEL = "INFO"
  CB_IN_PAPER_MODE = "true"
  P2P_ASSET = "USDT"
  P2P_FIAT = "SDG"

[mounts]
  source = "data"
  destination = "/app/data"

[deploy]
  healthcheck_path = "/api/journal/summary"
